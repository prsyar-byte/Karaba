<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>زانیاری کاره‌با - محمد مستەفا</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html {
            scroll-behavior: smooth;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --accent: #f093fb;
            --dark: #2d3748;
            --light: #f7fafc;
            --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-request: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: var(--dark);
            overflow-x: hidden;
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 2.2em;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .owner-info {
            font-size: 1.1em;
            color: #4a5568;
            margin-bottom: 15px;
        }

        .call-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--gradient);
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1em;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .call-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
        }

        .nav-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            position: sticky;
            top: 0;
            z-index: 5;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.95);
            color: var(--dark);
            border: none;
            padding: 15px 25px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            min-width: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .nav-btn:hover {
            transform: translateY(-3px);
            background: white;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .nav-btn.active {
            background: var(--gradient);
            color: white;
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }

        .nav-btn.request-btn {
            background: var(--gradient-request);
            color: white;
            animation: pulse 2s infinite;
        }

        .nav-btn.request-btn:hover {
            background: var(--gradient-request);
            color: white;
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(245, 87, 108, 0.5);
        }

        .nav-btn.request-btn.active {
            background: var(--gradient-request);
            color: white;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 4px 15px rgba(245, 87, 108, 0.3); }
            50% { box-shadow: 0 4px 25px rgba(245, 87, 108, 0.6); }
        }

        .content-area {
            max-width: 900px;
            margin: 20px auto 40px;
            background: rgba(255, 255, 255, 0.98);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            scroll-margin-top: 20px;
        }

        .section-title {
            font-size: 1.8em;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 25px;
            text-align: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
        }

        .content-image {
            max-width: 100%;
            height: auto;
            border-radius: 15px;
            margin: 20px 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .content-text {
            line-height: 1.8;
            font-size: 1.1em;
            text-align: right;
            white-space: pre-wrap;
            color: #4a5568;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            border-right: 4px solid var(--primary);
        }

        .contact-form-container {
            max-width: 900px;
            margin: 40px auto;
            background: rgba(255, 255, 255, 0.98);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            scroll-margin-top: 20px;
        }

        .contact-form-title {
            font-size: 2em;
            background: var(--gradient-request);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 30px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4a5568;
            font-size: 1.05em;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s ease;
            background: white;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #f5576c;
            box-shadow: 0 0 0 3px rgba(245, 87, 108, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        /* GPS Status */
        .gps-status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.95em;
            font-weight: 600;
        }

        .gps-status.loading {
            background: #fef3c7;
            color: #92400e;
            border: 1px solid #fcd34d;
        }

        .gps-status.success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #6ee7b7;
        }

        .gps-status.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .gps-status i {
            font-size: 1.2em;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(146, 64, 14, 0.3);
            border-radius: 50%;
            border-top-color: #92400e;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .submit-btn {
            width: 100%;
            background: var(--gradient-request);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(245, 87, 108, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(245, 87, 108, 0.6);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: white;
            font-size: 0.9em;
            background: rgba(0,0,0,0.2);
        }

        @media (max-width: 768px) {
            h1 { font-size: 1.6em; }
            
            .nav-container {
                gap: 8px;
                padding: 15px 10px;
            }

            .nav-btn {
                min-width: 45%;
                padding: 12px 10px;
                font-size: 0.9em;
            }

            .content-area,
            .contact-form-container {
                margin: 15px;
                padding: 25px 15px;
            }

            .section-title,
            .contact-form-title {
                font-size: 1.4em;
            }
            
            .call-btn {
                width: 90%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <header id="topHeader">
        <div class="logo-container">
            <h1><i class="fas fa-bolt"></i> زانیاری کاره‌با</h1>
            <div class="owner-info">
                <i class="fas fa-user-circle"></i> خاوه‌نی مالپه‌ر: <strong>محمه‌د مسته‌فا</strong>
            </div>
            <a href="tel:+9647738788343" class="call-btn">
                <i class="fas fa-phone-alt"></i>
                پەیوەندی کردن
            </a>
        </div>
    </header>

    <nav class="nav-container" id="navContainer">
    </nav>

    <main class="content-area" id="mainContent">
        <h2 id="displayTitle" class="section-title">بەخێربێیت</h2>
        <img id="displayImage" class="content-image" src="" alt="Section Image">
        <div id="displayText" class="content-text">
            تکایە یەکێک لە دوگمەکانی سەرەوە هەڵبژێرە بۆ بینینی زانیاری.
        </div>
    </main>

    <div class="contact-form-container" id="contactForm">
        <h2 class="contact-form-title">
            <i class="fas fa-paper-plane"></i> داواکاری
        </h2>
        
        <!-- GPS Status -->
        <div class="gps-status loading" id="gpsStatus">
            <span class="spinner"></span>
            <span>چاوەڕوانی شوێنی GPS...</span>
        </div>

        <form id="whatsappForm">
            <div class="form-group">
                <label for="userName"><i class="fas fa-user"></i> ناو:</label>
                <input type="text" id="userName" placeholder="ناوی تەواوت بنووسە" required>
            </div>

            <div class="form-group">
                <label for="userPhone"><i class="fas fa-phone"></i> ژمارەی مۆبایل:</label>
                <input type="tel" id="userPhone" placeholder="07XX XXX XXXX" required>
            </div>

            <div class="form-group">
                <label for="jobType"><i class="fas fa-briefcase"></i> جۆری کار:</label>
                <select id="jobType" required>
                    <option value="">جۆری کار هەڵبژێرە</option>
                    <option value="تەئسیسات">تەئسیسات</option>
                    <option value="کلاسیک کۆنتڕۆڵ">کلاسیک کۆنتڕۆڵ</option>
                    <option value="ماتۆر">ماتۆر</option>
                    <option value="PLC">PLC</option>
                    <option value="AC Drive">AC Drive</option>
                    <option value="کێبڵ">کێبڵ</option>
                    <option value="جۆری تر">جۆری تر</option>
                </select>
            </div>

            <div class="form-group">
                <label for="userMessage"><i class="fas fa-comment"></i> وردەکاری:</label>
                <textarea id="userMessage" placeholder="وردەکاری داواکارییەکەت لێرە بنووسە..." required></textarea>
            </div>

            <button type="submit" class="submit-btn">
                <i class="fab fa-whatsapp"></i>
                ناردن بۆ واتسئەپ
            </button>
        </form>
    </div>

    <footer>
        <p>&copy; 2026 Designed for Dzhwar Edres</p>
    </footer>

    <script>
        const defaultData = [
            { id: 0, title: "تەئسیسات", text: "زانیاری دەربارەی تەئسیساتی کارەبا...", img: "" },
            { id: 1, title: "کلاسیک کۆنتڕۆڵ", text: "زانیاری دەربارەی کلاسیک کۆنتڕۆڵ...", img: "" },
            { id: 2, title: "ماتۆر", text: "جۆرەکانی ماتۆر و شیکردنەوە...", img: "" },
            { id: 3, title: "PLC", text: "بەرنامەسازی و سیستەمی PLC...", img: "" },
            { id: 4, title: "AC Drive", text: "کۆنتڕۆڵی خێرایی ماتۆر بە درایڤ...", img: "" },
            { id: 5, title: "کێبڵ", text: "جۆرەکانی کێبڵ و تواناکانیان...", img: "" }
        ];

        let appData = JSON.parse(localStorage.getItem('electricalAppData')) || defaultData;

        // GPS Variables
        let userLocation = null;
        let locationError = null;

        function init() {
            renderNavButtons();
            showContent(0);
            getLocation();
        }

        // Get GPS Location
        function getLocation() {
            const gpsStatus = document.getElementById('gpsStatus');
            
            if (!navigator.geolocation) {
                gpsStatus.className = 'gps-status error';
                gpsStatus.innerHTML = '<i class="fas fa-exclamation-triangle"></i><span>ئامێرەکەت GPS پشتگیری ناکات</span>';
                locationError = 'GPS پشتگیری ناکات';
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    // Success
                    userLocation = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };
                    gpsStatus.className = 'gps-status success';
                    gpsStatus.innerHTML = '<i class="fas fa-map-marker-alt"></i><span>شوێنەکەت بە سەرکەوتوویی وەرگیرا ✓</span>';
                },
                function(error) {
                    // Error
                    gpsStatus.className = 'gps-status error';
                    let errorMsg = 'نەتوانرا شوێنەکەت وەربگیرێت';
                    
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            errorMsg = 'ڕەتکردنەوەی مۆڵەتی شوێن - تکایە GPS بکەرەوە';
                            break;
                        case error.POSITION_UNAVAILABLE:
                            errorMsg = 'زانیاری شوێن بەردەست نییە';
                            break;
                        case error.TIMEOUT:
                            errorMsg = 'کاتی وەرگرتنی شوێن تەواو بوو';
                            break;
                    }
                    
                    gpsStatus.innerHTML = `<i class="fas fa-exclamation-triangle"></i><span>${errorMsg}</span>`;
                    locationError = errorMsg;
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        function renderNavButtons() {
            const container = document.getElementById('navContainer');
            container.innerHTML = '';
            
            appData.forEach((item, index) => {
                const btn = document.createElement('button');
                btn.className = 'nav-btn';
                btn.innerHTML = `<i class="fas fa-circle-dot"></i> ${item.title}`;
                btn.onclick = () => {
                    showContent(index);
                    scrollToContent();
                };
                btn.id = `btn-${index}`;
                container.appendChild(btn);
            });

            const requestBtn = document.createElement('button');
            requestBtn.className = 'nav-btn request-btn';
            requestBtn.innerHTML = `<i class="fas fa-paper-plane"></i> داواکاری`;
            requestBtn.onclick = () => {
                scrollToRequest();
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                requestBtn.classList.add('active');
            };
            requestBtn.id = 'btn-request';
            container.appendChild(requestBtn);
        }

        function showContent(index) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${index}`).classList.add('active');

            const item = appData[index];
            document.getElementById('displayTitle').innerText = item.title;
            document.getElementById('displayText').innerText = item.text ? item.text : "هیچ زانیارییەک نەنووسراوە.";
            
            const imgEl = document.getElementById('displayImage');
            if (item.img && item.img.trim() !== "") {
                imgEl.src = item.img;
                imgEl.style.display = "block";
            } else {
                imgEl.style.display = "none";
            }
        }

        function scrollToContent() {
            const contentArea = document.getElementById('mainContent');
            contentArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function scrollToRequest() {
            const requestForm = document.getElementById('contactForm');
            requestForm.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // WhatsApp Form Submission with GPS
        document.getElementById('whatsappForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('userName').value;
            const phone = document.getElementById('userPhone').value;
            const jobType = document.getElementById('jobType').value;
            const message = document.getElementById('userMessage').value;

            // Build message
            let whatsappMessage = `*داواکاری نوێ*\n\n` +
                                  `👤 *ناو:* ${name}\n` +
                                  `📱 *ژمارەی مۆبایل:* ${phone}\n` +
                                  `💼 *جۆری کار:* ${jobType}\n` +
                                  `📝 *وردەکاری:*\n${message}`;

            // Add GPS location if available
            if (userLocation) {
                const mapsLink = `https://www.google.com/maps?q=${userLocation.lat},${userLocation.lng}`;
                whatsappMessage += `\n\n📍 *شوێنی کڕیار:*\n${mapsLink}`;
            } else if (locationError) {
                whatsappMessage += `\n\n⚠️ *شوێن:* نەتوانرا شوێن وەربگیرێت (${locationError})`;
            }

            const whatsappNumber = '9647501757120';
            const whatsappURL = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(whatsappMessage)}`;

            window.open(whatsappURL, '_blank');
            this.reset();
        });

        init();
    </script>
</body>
</html>
