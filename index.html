<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>زانیاری کاره‌با - محمد مستەفا</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html { scroll-behavior: smooth; }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --dark: #2d3748;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: var(--dark);
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 2.2em;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .owner-info { font-size: 1.1em; color: #4a5568; margin-bottom: 15px; }

        .whatsapp-btn {
            display: inline-flex; align-items: center; gap: 10px;
            background: var(--gradient); color: white;
            padding: 10px 25px; border-radius: 50px;
            text-decoration: none; font-weight: bold;
            transition: 0.3s; box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .whatsapp-btn:hover { transform: translateY(-2px); }

        /* Search Box Style */
        .search-container {
            max-width: 600px;
            margin: 20px auto;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 15px 50px 15px 20px;
            border-radius: 50px;
            border: 2px solid #e2e8f0;
            font-size: 1em;
            outline: none;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.2);
        }

        .search-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
        }

        .nav-container {
            display: flex; justify-content: center; flex-wrap: wrap;
            gap: 12px; padding: 20px; max-width: 1200px; margin: 0 auto;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.95);
            color: var(--dark); border: none;
            padding: 15px 25px; border-radius: 12px;
            cursor: pointer; font-size: 1em; font-weight: 600;
            transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            min-width: 130px; display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        .nav-btn:hover { transform: translateY(-3px); background: white; }
        .nav-btn.active { background: var(--gradient); color: white; transform: scale(1.05); }

        .content-area {
            max-width: 900px; margin: 20px auto 40px;
            background: rgba(255, 255, 255, 0.98);
            padding: 40px; border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            scroll-margin-top: 20px;
            position: relative;
        }

        .section-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 15px;
        }

        .section-title {
            font-size: 1.8em; background: var(--gradient);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .share-btn {
            background: #25D366; color: white;
            border: none; padding: 8px 15px; border-radius: 20px;
            cursor: pointer; font-size: 0.9em; display: flex; align-items: center; gap: 5px;
            transition: 0.3s;
        }
        .share-btn:hover { background: #1ebc57; transform: scale(1.05); }

        .content-image {
            max-width: 100%; height: auto; border-radius: 15px;
            margin: 20px 0; box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            display: none; animation: fadeIn 0.5s ease;
        }

        .content-text {
            line-height: 1.8; font-size: 1.1em; text-align: right;
            white-space: pre-wrap; color: #4a5568;
            padding: 20px; background: #f8f9fa;
            border-radius: 12px; border-right: 4px solid var(--primary);
        }

        .no-result {
            text-align: center; color: #718096; padding: 20px; display: none;
        }

        footer { text-align: center; padding: 20px; color: white; font-size: 0.9em; background: rgba(0,0,0,0.2); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) {
            h1 { font-size: 1.6em; }
            .nav-btn { min-width: 45%; padding: 12px 10px; font-size: 0.9em; }
            .content-area { margin: 15px; padding: 25px 15px; }
            .section-header { flex-direction: column; gap: 10px; align-items: flex-start; }
            .share-btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <h1><i class="fas fa-bolt"></i> زانیاری کاره‌با</h1>
            <div class="owner-info">
                <i class="fas fa-user-circle"></i> خاوه‌نی مالپه‌ر: <strong>محمه‌د مسته‌فا</strong>
            </div>
            <a href="https://wa.me/9647738788343" class="whatsapp-btn" target="_blank">
                <i class="fab fa-whatsapp"></i> پەیوەندی کردن: 07738788343
            </a>
        </div>
        
        <!-- Search Bar Added Here -->
        <div class="search-container">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="گەڕان بەدوای زانیاری..." onkeyup="searchContent()">
        </div>
    </header>

    <nav class="nav-container" id="navContainer"></nav>

    <main class="content-area" id="mainContent">
        <div class="section-header">
            <h2 id="displayTitle" class="section-title">بەخێربێیت</h2>
            <button class="share-btn" onclick="shareCurrentSection()">
                <i class="fas fa-share-alt"></i> هاوبەشکردن
            </button>
        </div>
        
        <img id="displayImage" class="content-image" src="" alt="Section Image">
        <div id="displayText" class="content-text">
            تکایە یەکێک لە دوگمەکانی سەرەوە هەڵبژێرە بۆ بینینی زانیاری.
        </div>
        <div id="noResult" class="no-result">
            <i class="fas fa-exclamation-circle"></i> هیچ ئەنجامێک نەدۆزرایەوە.
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Designed for Dzhwar Edres
        </p>
    </footer>

    <script>
        const defaultData = [
            { id: 0, title: "تەئسیسات", text: "زانیاری دەربارەی تەئسیساتی کارەبا...", img: "" },
            { id: 1, title: "کلاسیک کۆنتڕۆڵ", text: "زانیاری دەربارەی کلاسیک کۆنتڕۆڵ...", img: "" },
            { id: 2, title: "ماتۆر", text: "جۆرەکانی ماتۆر و شیکردنەوە...", img: "" },
            { id: 3, title: "PLC", text: "بەرنامەسازی و سیستەمی PLC...", img: "" },
            { id: 4, title: "AC Drive", text: "کۆنتڕۆڵی خێرایی ماتۆر بە درایڤ...", img: "" },
            { id: 5, title: "کێبڵ", text: "جۆرەکانی کێبڵ و تواناکانیان...", img: "" }
        ];

        let appData = JSON.parse(localStorage.getItem('electricalAppData')) || defaultData;
        let currentIndex = 0;

        function init() {
            renderNavButtons();
            showContent(0);
        }

        function renderNavButtons() {
            const container = document.getElementById('navContainer');
            container.innerHTML = '';
            appData.forEach((item, index) => {
                const btn = document.createElement('button');
                btn.className = 'nav-btn';
                btn.innerHTML = `<i class="fas fa-circle-dot"></i> ${item.title}`;
                btn.onclick = () => {
                    showContent(index);
                    scrollToContent();
                    // Clear search when clicking a button
                    document.getElementById('searchInput').value = '';
                    document.getElementById('noResult').style.display = 'none';
                };
                btn.id = `btn-${index}`;
                container.appendChild(btn);
            });
        }

        function showContent(index) {
            currentIndex = index;
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-${index}`);
            if(activeBtn) activeBtn.classList.add('active');

            const item = appData[index];
            document.getElementById('displayTitle').innerText = item.title;
            document.getElementById('displayText').innerText = item.text ? item.text : "هیچ زانیارییەک نەنووسراوە.";
            
            const imgEl = document.getElementById('displayImage');
            if (item.img && item.img.trim() !== "") {
                imgEl.src = item.img;
                imgEl.style.display = "block";
            } else {
                imgEl.style.display = "none";
            }
            
            // Hide no result message
            document.getElementById('noResult').style.display = 'none';
            document.getElementById('displayText').style.display = 'block';
            document.getElementById('displayImage').style.display = item.img ? 'block' : 'none';
        }

        function scrollToContent() {
            document.getElementById('mainContent').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // Search Function
        function searchContent() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            let found = false;

            if (query === "") {
                showContent(currentIndex);
                return;
            }

            // Search through all data
            for (let i = 0; i < appData.length; i++) {
                const item = appData[i];
                if (item.title.toLowerCase().includes(query) || item.text.toLowerCase().includes(query)) {
                    showContent(i);
                    found = true;
                    break; // Show the first match
                }
            }

            if (!found) {
                document.getElementById('displayTitle').innerText = "ئەنجام";
                document.getElementById('displayText').style.display = 'none';
                document.getElementById('displayImage').style.display = 'none';
                document.getElementById('noResult').style.display = 'block';
            }
        }

        // Share Function
        async function shareCurrentSection() {
            const item = appData[currentIndex];
            const shareData = {
                title: 'زانیاری کارەبا - ' + item.title,
                text: item.text.substring(0, 100) + '...', // First 100 chars
                url: window.location.href
            };

            try {
                if (navigator.share) {
                    await navigator.share(shareData);
                } else {
                    // Fallback for desktop or unsupported browsers
                    alert("لینکی پەڕەکە کۆپی کرا!");
                    navigator.clipboard.writeText(window.location.href);
                }
            } catch (err) {
                console.log('Error sharing:', err);
            }
        }

        init();
    </script>
</body>
</html>
