<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پانێڵی بەڕێوەبردن - Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 40px;
            font-size: 1.1em;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .back-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.6);
        }

        .form-group {
            margin-bottom: 30px;
            border: 2px solid #e2e8f0;
            padding: 25px;
            border-radius: 15px;
            background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
            transition: all 0.3s ease;
        }

        .form-group:hover {
            border-color: #667eea;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }

        .form-group h3 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group h3::before {
            content: '';
            width: 40px;
            height: 4px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4a5568;
            font-size: 1.05em;
        }

        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 1em;
            transition: all 0.3s ease;
            background: white;
        }

        .form-group input:focus, 
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .save-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.15em;
            font-weight: 600;
            cursor: pointer;
            border-radius: 50px;
            flex: 1;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .save-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.6);
        }

        .reset-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.15em;
            font-weight: 600;
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(245, 87, 108, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .reset-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(245, 87, 108, 0.6);
        }

        .alert {
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            display: none;
            animation: alertSlide 0.5s ease;
            text-align: center;
            font-size: 1.1em;
            font-weight: 600;
        }

        @keyframes alertSlide {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .alert-success {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            color: white;
            box-shadow: 0 5px 20px rgba(72, 187, 120, 0.4);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container { padding: 25px 20px; }
            h1 { font-size: 1.8em; }
            .button-group { flex-direction: column; }
            .save-btn, .reset-btn { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-btn">
            <i class="fas fa-arrow-right"></i>
            گەڕانەوە بۆ ماڵپەڕ
        </a>
        
        <h1><i class="fas fa-cog fa-spin"></i> پانێڵی بەڕێوەبردن</h1>
        <p class="subtitle">لێرە دەتوانیت ناوی دوگمەکان، وێنەکان و دەقەکان بگۆڕیت</p>

        <div class="alert alert-success" id="successAlert">
            <i class="fas fa-check-circle"></i> زانیارییەکان سەرکەوتووانە پاشکە کران!
        </div>

        <div id="adminForms">
        </div>

        <div class="button-group">
            <button class="save-btn" onclick="saveData()">
                <i class="fas fa-save"></i>
                پاشکەکردنی گۆڕانکارییەکان
            </button>
            <button class="reset-btn" onclick="resetData()">
                <i class="fas fa-undo"></i>
                گەڕانەوە بۆ بنەڕەت
            </button>
        </div>
    </div>

    <script>
        const defaultData = [
            { id: 0, title: "تەئسیسات", text: "زانیاری دەربارەی تەئسیساتی کارەبا...", img: "" },
            { id: 1, title: "کلاسیک کۆنتڕۆڵ", text: "زانیاری دەربارەی کلاسیک کۆنتڕۆڵ...", img: "" },
            { id: 2, title: "ماتۆر", text: "جۆرەکانی ماتۆر و شیکردنەوە...", img: "" },
            { id: 3, title: "PLC", text: "بەرنامەسازی و سیستەمی PLC...", img: "" },
            { id: 4, title: "AC Drive", text: "کۆنتڕۆڵی خێرایی ماتۆر بە درایڤ...", img: "" },
            { id: 5, title: "کێبڵ", text: "جۆرەکانی کێبڵ و تواناکانیان...", img: "" }
        ];

        let appData = JSON.parse(localStorage.getItem('electricalAppData')) || defaultData;

        function init() {
            renderAdminForms();
        }

        function renderAdminForms() {
            const container = document.getElementById('adminForms');
            container.innerHTML = '';

            appData.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'form-group';
                div.innerHTML = `
                    <h3>دوگمەی ${index + 1}: ${item.title}</h3>
                    
                    <label><i class="fas fa-heading"></i> ناوی دوگمە:</label>
                    <input type="text" id="admin-title-${index}" value="${item.title}">
                    
                    <label><i class="fas fa-image"></i> بەستی وێنە (URL):</label>
                    <input type="text" id="admin-img-${index}" value="${item.img}" placeholder="لێرە لینکی وێنە دابنێ">
                    
                    <label><i class="fas fa-align-right"></i> زانیاری / دەق:</label>
                    <textarea id="admin-text-${index}" rows="5">${item.text}</textarea>
                `;
                container.appendChild(div);
            });
        }

        function saveData() {
            appData.forEach((item, index) => {
                item.title = document.getElementById(`admin-title-${index}`).value;
                item.img = document.getElementById(`admin-img-${index}`).value;
                item.text = document.getElementById(`admin-text-${index}`).value;
            });

            localStorage.setItem('electricalAppData', JSON.stringify(appData));
            
            const alert = document.getElementById('successAlert');
            alert.style.display = 'block';
            
            setTimeout(() => {
                alert.style.display = 'none';
            }, 3000);

            // Scroll to top to show alert
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetData() {
            if (confirm('ئایا دڵنیایت دەتەوێت هەموو زانیارییەکان بگەڕێنیتەوە بۆ بنەڕەت؟')) {
                localStorage.removeItem('electricalAppData');
                appData = defaultData;
                renderAdminForms();
                alert('زانیارییەکان گەڕێنرایەوە بۆ بنەڕەت!');
            }
        }

        init();
    </script>
</body>
</html>
